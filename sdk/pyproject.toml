[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abbvie-dataops-governance-sdk"
version = "0.2.0"
description = "Manifest-driven DataOps governance SDK: schema enforcement, DQ, constraints, tokenization, OpenLineage + DataHub emission across Snowflake / EMR / SuiteCRM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AbbVie Data Platform" }]
dependencies = [
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "requests>=2.31",
  "click>=8.1",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.7"]
aws = ["boto3>=1.34"]
datahub = ["acryl-datahub>=0.13.0"]
openlineage = ["openlineage-python>=1.18.0"]
all = [
  "snowflake-connector-python>=3.7",
  "boto3>=1.34",
  "acryl-datahub>=0.13.0",
  "openlineage-python>=1.18.0",
]
dev = ["pytest>=7.4", "ruff>=0.3", "mypy>=1.8"]

[project.scripts]
abbvie-dataops = "abbvie_dataops_governance.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
