# Co-located DataHub + Marquez bring-up for the AbbVie DataOps PoC EC2.
# Targets the user-provided Ubuntu instance i-0165db8e63bcdb1d3.
#
# Ports exposed (added to the EC2 SG by terraform/aws):
#   8080 -> DataHub frontend (UI)
#   8000 -> DataHub GMS REST (used by the SDK emitter)
#   5000 -> Marquez API (used by OpenLineage emitter + Spark listener)
#   3000 -> Marquez Web UI
version: "3.9"

x-shared-deps: &kafka_deps
  depends_on:
    - zookeeper
    - broker

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]

  broker:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,PLAINTEXT_HOST://broker:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["9092:9092"]

  elasticsearch:
    image: elasticsearch:7.17.21
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports: ["9200:9200"]

  mysql-datahub:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: datahub
      MYSQL_DATABASE: datahub
      MYSQL_USER: datahub
      MYSQL_PASSWORD: datahub
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    ports: ["33306:3306"]

  datahub-gms:
    image: linkedin/datahub-gms:v0.13.3
    <<: *kafka_deps
    depends_on:
      - elasticsearch
      - mysql-datahub
    environment:
      EBEAN_DATASOURCE_USERNAME: datahub
      EBEAN_DATASOURCE_PASSWORD: datahub
      EBEAN_DATASOURCE_URL: jdbc:mysql://mysql-datahub:3306/datahub?verifyServerCertificate=false&useSSL=false&useUnicode=yes&characterEncoding=UTF-8
      EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver
      KAFKA_BOOTSTRAP_SERVER: broker:9092
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
    ports: ["8000:8080"]

  datahub-frontend:
    image: linkedin/datahub-frontend-react:v0.13.3
    depends_on: [datahub-gms]
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_SECRET: abbvie-dataops-poc-secret
      DATAHUB_APP_VERSION: "1.0"
    ports: ["8080:9002"]

  marquez-db:
    image: postgres:14
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    ports: ["35432:5432"]

  marquez:
    image: marquezproject/marquez:0.50.0
    depends_on: [marquez-db]
    ports: ["5000:5000", "5001:5001"]
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    depends_on: [marquez]
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
    ports: ["3000:3000"]
