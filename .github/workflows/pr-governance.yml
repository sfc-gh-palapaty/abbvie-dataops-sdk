# PR-time governance gate: implements the AbbVie "data-change rule".
# Detects which manifests are touched, runs them in DEVELOP profile,
# and fails closed if a data-affecting PR is missing required artifacts.

name: pr-governance

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  data-change-gate:
    runs-on: ubuntu-latest
    # PR-time gate runs OFFLINE. We do not configure AWS credentials here
    # because PRs from forks would otherwise expose prod secrets. The SDK
    # adapters detect `profile=develop` and skip any Secrets Manager reads.
    # AWS_REGION is set defensively so any boto3 client that does get
    # constructed (e.g. for a future adapter) at least has a region and
    # surfaces a clear "no credentials" error instead of NoRegionError.
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e './sdk[all]'

      - name: Compute changed files
        id: diff
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}".."${{ github.event.pull_request.head.sha }}" > changed.txt
          echo "---- changed files ----"
          cat changed.txt

      - name: Run change-detector gate
        id: gate
        run: |
          abbvie-dataops gate --changed-files changed.txt --out gate.json --strict || GATE_EXIT=$?
          echo "exit=${GATE_EXIT:-0}" >> $GITHUB_OUTPUT
          cat gate.json

      - name: Run triggered manifests in DEVELOP profile
        if: ${{ steps.gate.outputs.exit != '2' }}
        run: |
          for m in $(jq -r '.triggered_manifests[]' gate.json); do
            echo "::group::develop run for $m"
            abbvie-dataops run --manifest "$m" --profile develop --evidence-out "evidence-$(basename $m .yaml).json" || true
            echo "::endgroup::"
          done

      - name: Upload evidence bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-evidence
          path: |
            evidence-*.json
            gate.json

      - name: Comment evidence on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const gate = JSON.parse(fs.readFileSync('gate.json', 'utf8'));
            const lines = [];
            lines.push(`### DataOps governance gate`);
            lines.push(`- **is_data_change:** \`${gate.is_data_change}\``);
            lines.push(`- **triggered_manifests:** ${gate.triggered_manifests.length === 0 ? '_(none)_' : gate.triggered_manifests.map(m => `\`${m}\``).join(', ')}`);
            lines.push(`- **must_fail_closed:** \`${gate.must_fail_closed}\``);
            if (gate.blockers.length > 0) {
              lines.push(`- **blockers:**`);
              for (const b of gate.blockers) lines.push(`  - ${b}`);
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });

      - name: Enforce strict gate
        if: ${{ steps.gate.outputs.exit == '2' }}
        run: |
          echo "Data-change PR is missing required artifacts (see PR comment)."
          exit 1
