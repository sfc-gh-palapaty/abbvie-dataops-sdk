name: sdk-ci

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "manifests/**"
      - ".github/workflows/sdk-ci.yml"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e './sdk[dev]'
      - name: Lint
        run: ruff check sdk/src
      - name: Unit tests
        run: pytest -q sdk/tests
      - name: Manifest dry-runs
        run: |
          for m in manifests/snowflake-curated.yaml manifests/emr-iceberg-bronze.yaml manifests/suitecrm-crm.yaml; do
            abbvie-dataops run --manifest "$m" --profile develop
          done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: terraform fmt -check
        run: terraform -chdir=terraform/aws fmt -check -recursive
